name: Hotspot portal checks
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test portal functionality and validate bundled assets
        run: node --test tests/*.test.cjs
